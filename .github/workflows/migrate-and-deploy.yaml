name: Migrate DB and deploy to Vercel

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  check_needs_migration:
    runs-on: ubuntu-22.04
    outputs:
      directory-modified: ${{ steps.directory-modified.outputs.db }}
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - id: directory-modified
        uses: dorny/paths-filter@v3.0.2
        with:
          base: ${{ github.ref_name }}
          filters: |
            db:
              - 'drizzle/**'

  check_migrations_are_committed:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: ./.github/actions/setup-node-steps
      - name: Ensure migrations are committed
        env:
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          npm run db:g-prod

          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "[Custom Error]: Schema changed but migrations are not committed. Run db:g and commit the drizzle/ changes."
            exit 1
          fi

  migrate:
    needs: [check_needs_migration, check_migrations_are_committed]
    if: needs.check_needs_migration.outputs.directory-modified == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    concurrency:
      group: migrate-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: ./.github/actions/setup-node-steps
      - name: Run DB migrations
        run: npm run db:m-prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

  deploy:
    needs: [check_needs_migration, check_migrations_are_committed, migrate]
    if: success() || (needs.migrate.result == 'skipped' && needs.check_migrations_are_committed.result == 'success')
    runs-on: ubuntu-22.04
    steps:
      - name: Trigger Vercel production deploy
        run: curl -fsS "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
