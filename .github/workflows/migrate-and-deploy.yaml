name: Migrate DB and deploy to Vercel

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  check-changes:
    runs-on: ubuntu-22.04
    outputs:
      directory-modified: ${{ steps.directory-modified.outputs.db }}
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - id: directory-modified
        uses: dorny/paths-filter@v3.0.2
        with:
          base: ${{ github.ref_name }}
          filters: |
            db:
              - 'drizzle/**'

  migrate:
    needs: check-changes
    if: needs.check-changes.outputs.directory-modified == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    concurrency:
      group: migrate-prod
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5.0.0
      - name: Setup node
        id: setup-node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: "22.17.1"
      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4.3.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - name: Install deps
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Run DB migrations
        run: npm run db:m-prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

  deploy:
    needs: [check-changes, migrate]
    if: success() || needs.migrate.result == 'skipped'
    runs-on: ubuntu-22.04
    steps:
      - name: Trigger Vercel production deploy
        run: curl -fsS "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
