name: Sync code from public repo (manual)

on:
  workflow_dispatch:
    inputs:
      public_branch:
        description: "Branch to pull from the public repo"
        required: true
        default: "master"
      private_branch:
        description: "Branch to overwrite in THIS private repo"
        required: true
        default: "deploy"

permissions:
  contents: write

concurrency:
  group: sync-from-public
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Mirror public -> private branch
        env:
          PUBLIC_REPO: https://github.com/techrome/test-svebble-neon.git
          PUBLIC_BRANCH: ${{ inputs.public_branch }}
          PRIVATE_BRANCH: ${{ inputs.private_branch }}
          PRIVATE_REPO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail

          rm -rf src.git
          git clone --mirror "$PUBLIC_REPO" src.git
          cd src.git

          git push "$PRIVATE_REPO" \
            "refs/heads/$PUBLIC_BRANCH:refs/heads/$PRIVATE_BRANCH" \
            --force
