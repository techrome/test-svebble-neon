name: Migrate DB

on:
  push:
    branches:
      - master
    paths:
      - "drizzle/**"
  workflow_dispatch: {}

concurrency:
  group: migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5.0.0
      - name: Setup node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: "22.17.1"
          cache: "npm"
      - name: Install deps
        run: npm ci
      - name: Run DB migrations
        run: npm run db:m-prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
