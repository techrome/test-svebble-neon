name: "Setup Node + deps"
description: "Setup node, cache node_modules, npm ci"
runs:
  using: "composite"
  steps:
    - name: Setup node
      id: setup-node
      uses: actions/setup-node@v6.0.0
      with:
        node-version: "22.17.1"

    - name: Cache node_modules
      id: nm-cache
      uses: actions/cache@v4.3.0
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

    - name: Install deps
      shell: bash
      if: steps.nm-cache.outputs.cache-hit != 'true'
      run: npm ci
