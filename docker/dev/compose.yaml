x-common-svc: &common
  env_file: "../../.env"
services:
  pg:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.postgres
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
  pgadmin4:
    <<: *common
    image: dpage/pgadmin4:8.13.0
    ports:
      - 5550:80
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json:ro
  redis:
    image: redis:7.4.7-alpine3.21
    ports:
      - "5551:6379"
  srh:
    image: hiett/serverless-redis-http:0.0.10
    ports:
      - "5552:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: dev_token
      SRH_CONNECTION_STRING: "redis://redis:6379"
  redisinsight:
    image: redis/redisinsight:2.70
    ports:
      - "5553:5540"
    depends_on:
      - redis
    volumes:
      - redisinsight:/data
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    ports:
      - "5554:9000" # S3 API
      - "5555:9001" # console UI
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
      MINIO_BUCKET: svebble-bucket
    entrypoint: >
      /bin/sh -c " set -eu; until mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; do
        echo 'waiting for minio...';
        sleep 1;
      done; mc mb --ignore-existing local/$${MINIO_BUCKET}; mc anonymous set download local/$${MINIO_BUCKET}; mc anonymous get local/$${MINIO_BUCKET}; "
volumes:
  pgdata:
  pgadmin:
  redisinsight:
  minio-data:
